name: CI Build

# 构建修复分支的未签名 mrkd.app 供本地安装验证。
# 构造与 release.yml 相同，但关闭代码签名（fork 没有开发者证书）。
on:
  push:
    branches: [fix/utf16-index-crash]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "macOS $(sw_vers -productVersion); Xcodes available:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          OS_MAJOR=$(sw_vers -productVersion | cut -d. -f1)
          XCODE=$(ls -d /Applications/Xcode_[0-9]*.app 2>/dev/null \
            | grep -vi beta \
            | awk -F'Xcode_' -v m="$OS_MAJOR" \
                '{split($2, v, "."); if (v[1] + 0 < 26 || m + 0 >= 26) print}' \
            | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "error: no Xcode on this runner can run on macOS $OS_MAJOR" >&2
            exit 1
          fi
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE"
          swift --version
          SWIFT_VER=$(swift --version 2>&1 \
            | sed -n 's/.*Apple Swift version \([0-9]*\)\.\([0-9]*\).*/\1\2/p' | head -1)
          if [ "${SWIFT_VER:-0}" -lt 61 ]; then
            echo "error: Swift 6.1+ required (SwaTex needs swift-tools-version 6.1)," >&2
            echo "but $XCODE provides $(swift --version 2>&1 | head -1)" >&2
            exit 1
          fi

      - name: Build Mermaid renderer
        run: ./scripts/build-mermaid.sh

      - name: Run tests
        run: swift test

      - name: Build Release (unsigned, arm64)
        run: |
          xcodebuild -project mrkd.xcodeproj -scheme mrkd -configuration Release \
            -derivedDataPath build \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            build

      - name: Package app
        run: |
          cd build/Build/Products/Release
          ditto -c -k --keepParent mrkd.app mrkd.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mrkd-fixed
          path: build/Build/Products/Release/mrkd.zip
          if-no-files-found: error