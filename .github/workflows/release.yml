name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # SwaTex declares swift-tools-version 6.1, so a toolchain older than
      # that cannot even resolve the dependency graph. Pinning an exact Xcode
      # broke the moment that dependency arrived, so pick the newest release
      # build on the runner and fail loudly if it is still too old, rather
      # than pinning a version that silently rots again.
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_[0-9]*.app 2>/dev/null \
            | grep -v -i beta | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "error: no Xcode found on the runner" >&2
            exit 1
          fi
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE"
          swift --version
          SWIFT_MINOR=$(swift --version 2>&1 \
            | sed -n 's/.*Apple Swift version \([0-9]*\)\.\([0-9]*\).*/\1\2/p' | head -1)
          if [ "${SWIFT_MINOR:-0}" -lt 61 ]; then
            echo "error: Swift 6.1+ required (SwaTex needs swift-tools-version 6.1)" >&2
            exit 1
          fi

      - name: Install certificate
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          CERT_PATH=$RUNNER_TEMP/certificate.p12

          echo "$CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          security set-key-partition-list -S apple-tool:,apple: \
            -k "" "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"

      # Both `swift test` and `xcodebuild` link against the Mermaid renderer,
      # so it has to exist before either runs. There is no fallback: a missing
      # dylib fails the link rather than quietly shipping an app whose
      # ```mermaid blocks render as nothing.
      - name: Build Mermaid renderer
        run: ./scripts/build-mermaid.sh

      - name: Run tests
        run: swift test

      - name: Build Release (Apple silicon)
        run: |
          xcodebuild -scheme mrkd -configuration Release \
            -derivedDataPath build \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            build

      - name: Notarize app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd build/Build/Products/Release
          ditto -c -k --keepParent mrkd.app mrkd-unsigned.zip

          # Capture submission ID so we can fetch the log if Apple rejects.
          SUBMIT_OUTPUT=$(xcrun notarytool submit mrkd-unsigned.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait 2>&1)
          echo "$SUBMIT_OUTPUT"

          SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | awk '/id:/ { print $2; exit }')

          if echo "$SUBMIT_OUTPUT" | grep -q "status: Invalid"; then
            echo "::error::Notarization rejected. Fetching log…"
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --team-id "$APPLE_TEAM_ID"
            exit 1
          fi

          xcrun stapler staple mrkd.app

      - name: Package app
        run: |
          cd build/Build/Products/Release
          ditto -c -k --keepParent mrkd.app mrkd.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/Build/Products/Release/mrkd.zip
          generate_release_notes: true

      - name: Clean up keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/build.keychain-db
