name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Two constraints pull in opposite directions. SwaTex declares
      # swift-tools-version 6.1, so Xcode 16.2 (Swift 6.0) cannot resolve the
      # dependency graph at all. But an Xcode newer than the runner's macOS
      # crashes actool on AppIcon.icon, because it expects system frameworks
      # the OS does not have. So: newest non-beta Xcode whose major version
      # the OS can actually host, and assert Swift 6.1 rather than discover
      # the shortfall halfway through a resolution log.
      - name: Select Xcode
        run: |
          echo "macOS $(sw_vers -productVersion); Xcodes available:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          OS_MAJOR=$(sw_vers -productVersion | cut -d. -f1)
          # Apple realigned version numbers at 26: Xcode 16 pairs with
          # macOS 15, but Xcode 26 and later need macOS 26 or later. So the
          # only exclusion is an Xcode 26+ on an older OS.
          XCODE=$(ls -d /Applications/Xcode_[0-9]*.app 2>/dev/null \
            | grep -vi beta \
            | awk -F'Xcode_' -v m="$OS_MAJOR" \
                '{split($2, v, "."); if (v[1] + 0 < 26 || m + 0 >= 26) print}' \
            | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "error: no Xcode on this runner can run on macOS $OS_MAJOR" >&2
            exit 1
          fi
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE"
          swift --version
          SWIFT_VER=$(swift --version 2>&1 \
            | sed -n 's/.*Apple Swift version \([0-9]*\)\.\([0-9]*\).*/\1\2/p' | head -1)
          if [ "${SWIFT_VER:-0}" -lt 61 ]; then
            echo "error: Swift 6.1+ required (SwaTex needs swift-tools-version 6.1)," >&2
            echo "but $XCODE provides $(swift --version 2>&1 | head -1)" >&2
            exit 1
          fi

      - name: Install certificate
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          CERT_PATH=$RUNNER_TEMP/certificate.p12

          echo "$CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          security set-key-partition-list -S apple-tool:,apple: \
            -k "" "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"

      # Both `swift test` and `xcodebuild` link against the Mermaid renderer,
      # so it has to exist before either runs. There is no fallback: a missing
      # dylib fails the link rather than quietly shipping an app whose
      # ```mermaid blocks render as nothing.
      - name: Build Mermaid renderer
        run: ./scripts/build-mermaid.sh

      - name: Run tests
        run: swift test

      - name: Build Release (Apple silicon)
        run: |
          xcodebuild -scheme mrkd -configuration Release \
            -derivedDataPath build \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            build

      - name: Notarize app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd build/Build/Products/Release
          ditto -c -k --keepParent mrkd.app mrkd-unsigned.zip

          # Capture submission ID so we can fetch the log if Apple rejects.
          # The status is taken by hand because the job runs under `bash -e`:
          # a failing command inside $( ) aborts the step immediately, which
          # threw away notarytool's own explanation of what went wrong and
          # left a two-second failure with no output at all.
          set +e
          SUBMIT_OUTPUT=$(xcrun notarytool submit mrkd-unsigned.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait 2>&1)
          SUBMIT_STATUS=$?
          set -e
          echo "$SUBMIT_OUTPUT"

          SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | awk '/id:/ { print $2; exit }')

          if [ "$SUBMIT_STATUS" -ne 0 ]; then
            echo "::error::notarytool exited $SUBMIT_STATUS -- see its output above." >&2
            if [ -n "$SUBMISSION_ID" ]; then
              xcrun notarytool log "$SUBMISSION_ID" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_APP_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" || true
            fi
            exit 1
          fi

          if echo "$SUBMIT_OUTPUT" | grep -q "status: Invalid"; then
            echo "::error::Notarization rejected. Fetching log…"
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --team-id "$APPLE_TEAM_ID"
            exit 1
          fi

          xcrun stapler staple mrkd.app

      - name: Package app
        run: |
          cd build/Build/Products/Release
          ditto -c -k --keepParent mrkd.app mrkd.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/Build/Products/Release/mrkd.zip
          generate_release_notes: true

      - name: Clean up keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/build.keychain-db
