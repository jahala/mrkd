name: mrkd
options:
  bundleIdPrefix: com.mrkd
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

# Xcode 15+ default: Debug builds produce a stub executable that
# redirects into a .debug.dylib for SwiftUI Previews. App extensions
# (e.g. our QL plug-in) crash when ExtensionKit tries to load the
# principal class from the stub. Disable it everywhere.
settings:
  ENABLE_DEBUG_DYLIB: NO

packages:
  swift-cmark:
    url: https://github.com/apple/swift-cmark.git
    branch: gfm
  Highlightr:
    url: https://github.com/raspu/Highlightr.git
    from: 2.2.0
  SwaTex:
    url: https://github.com/PhraseHQ/SwaTex.git
    from: 0.5.0

targets:
  mrkd:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "Resources/Info.plist"
          - "Resources/mrkd.entitlements"
          - "Resources/Fonts"
          - "QLExtension"
          - "Tests"
      - path: Sources/Resources/Fonts
        type: folder
        buildPhase: resources
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        SWIFT_VERSION: "5"
        PRODUCT_BUNDLE_IDENTIFIER: com.mrkd.app
        INFOPLIST_FILE: Sources/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Sources/Resources/mrkd.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        # The Mermaid renderer: a Rust cdylib built by
        # scripts/build-mermaid.sh. The module map lives beside the crate's
        # C header and autolinks -lmermaid_shim, so each build system only
        # has to say where the library is.
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/rust/mermaid-shim/include
        LIBRARY_SEARCH_PATHS: $(inherited) $(SRCROOT)/Frameworks
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../Frameworks
    dependencies:
      - package: swift-cmark
        product: cmark-gfm
      - package: swift-cmark
        product: cmark-gfm-extensions
      - package: Highlightr
      - package: SwaTex
        product: SwaTex
      - package: SwaTex
        product: SwaTexRender
      - target: QLPlugin
        embed: true
      # Embedded here and only here. The Quick Look extension links the same
      # dylib but does not carry its own copy — that is the whole reason it is
      # a dynamic library, and why Intel was dropped rather than paying ~9.5 MB
      # twice. `link: false` because the module map already autolinks it.
      - framework: Frameworks/libmermaid_shim.dylib
        embed: true
        link: false
        codeSign: true


  QLPlugin:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/QLExtension
        excludes:
          - "Info.plist"
          - "QLExtension.entitlements"
      - path: Sources/Engine
      - path: Sources/App/FontRegistrar.swift
      # View layer shared with the mrkd target so PreviewViewController
      # can host a MarkdownViewController directly (TOC sidebar, article
      # width cap, themed Open button, fragment links — all inherited).
      - path: Sources/UI/MarkdownViewController.swift
      - path: Sources/UI/TOCFloatingView.swift
      - path: Sources/UI/OpenWithButton.swift
      - path: Sources/UI/ReloadBannerView.swift
      - path: Sources/UI/ChangedBlockGutterView.swift
      - path: Sources/UI/TextInteractionHandler.swift
      - path: Sources/UI/DocumentFindController.swift
      - path: Sources/UI/FragmentLinkHandler.swift
      - path: Sources/UI/FontSizeManager.swift
      - path: Sources/Platform/FileWatcher.swift
      - path: Sources/Platform/Debouncer.swift
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        SWIFT_VERSION: "5"
        PRODUCT_BUNDLE_IDENTIFIER: com.mrkd.app.QLPlugin
        INFOPLIST_FILE: Sources/QLExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Sources/QLExtension/QLExtension.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        # Links the same Mermaid dylib the app embeds, and finds it at run
        # time by walking out of the .appex to the host app's Frameworks
        # directory. The extension is sandboxed and cannot spawn a helper
        # process, which is why this has to be a linked library at all.
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/rust/mermaid-shim/include
        LIBRARY_SEARCH_PATHS: $(inherited) $(SRCROOT)/Frameworks
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/../../../../Frameworks
    dependencies:
      - package: swift-cmark
        product: cmark-gfm
      - package: swift-cmark
        product: cmark-gfm-extensions
      - package: Highlightr
      - package: SwaTex
        product: SwaTex
      - package: SwaTex
        product: SwaTexRender
